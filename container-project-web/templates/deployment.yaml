apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/version: {{ .Values.image.tag | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: petclinic
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ add .Values.preStopSleepSeconds 30 }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # Nginx는 기동할 때 WAS_HOST를 DNS 조회한다. was Service가 먼저 있어야 한다
            - name: WAS_HOST
              value: {{ .Values.was.host | quote }}
            - name: WAS_PORT
              value: {{ .Values.was.port | quote }}
            {{- if .Values.logs.enabled }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
          {{- if .Values.logs.enabled }}
          volumeMounts:
            # 이미지의 /var/log/nginx/access.log · error.log는 stdout · stderr 심볼릭 링크다
            # 그 자리에 EFS(<dir>/<Pod 이름>/)를 덮어 마운트하면 nginx가 실제 파일로 쓴다
            - name: logs
              mountPath: /var/log/nginx
              subPathExpr: {{ .Values.logs.dir }}/$(POD_NAME)
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          # ADR-003: nginx.conf의 /healthz (로그 제외)
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.logs.enabled }}
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: {{ .Values.logs.claimName }}
      {{- end }}
